name: node-template
version: 0.5.0
description: A Typescript/node.js project template
license: Unlicense
engines: {node: ^24.18, pnpm: ^11.12}
type: module
bin:
  hello: bin/src/hello.js
scripts:
  build: tsc --build
  clean: rm -rf bin
  lint: eslint
  lint-fix: eslint --fix
  pretty: prettier . --check
  pretty-fix: prettier . --write
  pretest: tsc --build
  test: NODE_OPTIONS=--enable-source-maps jasmine
  hello: tsx src/hello.ts
devDependencies:
  '@tsconfig/node24': ^24.0.4
  '@types/node': ^24.13.3
  tsx: ^4.23.0
  typescript: ^6.0.3
dependencies:
  chalk: ^5.6.2
prettier:
  semi: false
  singleQuote: true
  trailingComma: all
  bracketSpacing: false
  printWidth: 100
  plugins:
    - '@ianvs/prettier-plugin-sort-imports'
  importOrder:
    - <BUILTIN_MODULES>
    - <THIRD_PARTY_MODULES>
    - ^[.]
  importOrderParserPlugins:
    - typescript
  importOrderTypeScriptVersion: 5.7.2
  importOrderCaseSensitive: false
